name: Deploy Django Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Trigger only when files in backend change

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the latest code from the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup SSH agent for secure connection to VPS
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_PRIVATE_KEY }}

      # 3. Add VPS host to known_hosts to prevent SSH authenticity prompts
      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 4. Sync the backend directory to the VPS using rsync
      - name: Sync backend code to VPS
        run: |
          rsync -avz --delete backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/starbound/backend/

      # 5. SSH into the VPS and perform deployment steps
      - name: Deploy backend on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e # Exit on error

            echo "Updating system and installing dependencies..."
            sudo apt update
            sudo apt install -y python3 python3-venv python3-pip

            echo "Changing to backend directory..."
            cd /var/www/starbound/backend

            echo "Creating virtual environment if missing..."
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            echo "Activating virtualenv and installing dependencies..."
            source venv/bin/activate
            pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt

            echo "Applying migrations and collecting static files..."
            python manage.py migrate
            python manage.py collectstatic --noinput

            echo "Restarting Gunicorn..."
            sudo systemctl restart gunicorn

            echo "✅ Backend deployment complete!"
          EOF
